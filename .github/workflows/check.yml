name: Check factory harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the real CLI and YAML parser for integration tests
        run: |
          python -m pip install 'git+https://github.com/Deploy-your-Startup/cli.git@v0.1.17'
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GitHub CLI with skills support
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.103.2_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Validate template and exercise creation, adoption and updates
        run: node --test scripts/tests/*.test.mjs
