schemaVersion: "1"
args:
  accountId:
    required: true
    description: ChatGPT account id, required as a header by the codex backend
env:
  SPROWI_CHATGPT_ACCOUNT_ID: ${{ env.args.accountId }}
kits:
  - ../../sandbox/kits/boundary
  - ../../sandbox/kits/mise
  - ../../sandbox/kits/images
  - source: ./kits/sprowi-codex
secrets:
  sprowi-codex:
    command: ${{ env.args.secretCommand }}
bindings:
  sprowi-codex:
    apiKey:
      domains:
        - chatgpt.com
