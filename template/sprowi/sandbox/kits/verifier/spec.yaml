# syntax=docker/sandbox-kit:3
# The verifier needs no model and no GitHub access. It still reaches package
# registries, because setupCommands install the project's dependencies here.
schemaVersion: '3'
kind: mixin
displayName: sprowi-verifier
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    install:
      allow:
      - registry.npmjs.org
      deny:
      - api.anthropic.com
      - api.openai.com
      - openrouter.ai
      - api.githubcopilot.com
      - api.business.githubcopilot.com
      - github.com
      - api.github.com
    runtime:
      deny:
      - api.anthropic.com
      - api.openai.com
      - openrouter.ai
      - api.githubcopilot.com
      - api.business.githubcopilot.com
      - github.com
      - api.github.com
