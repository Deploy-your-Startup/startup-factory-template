schemaVersion: "1"
args:
  cli:
    required: true
kits:
  - ../../sandbox/kits/boundary
  - ../../sandbox/kits/mise
  - ../../sandbox/kits/images
  - source: ./kits/sprowi-copilot
    args:
      cli: ${{ env.args.cli }}
secrets:
  sprowi-copilot:
    command: ${{ env.args.secretCommand }}
bindings:
  sprowi-copilot:
    apiKey:
      domains:
        - api.github.com
        - api.githubcopilot.com
        - api.business.githubcopilot.com
