apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: t3-workspace
      spec:
        template:
          spec:
            containers:
              - name: t3-workspace
                env:
                  - name: GH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: t3-github
                        key: token
