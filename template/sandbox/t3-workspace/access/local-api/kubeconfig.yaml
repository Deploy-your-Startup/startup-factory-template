apiVersion: v1
kind: Config
clusters:
  - name: workspace-host
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/t3/local-identity/ca.crt
users:
  - name: workspace
    user:
      tokenFile: /var/run/t3/local-identity/token
contexts:
  - name: workspace-local
    context:
      cluster: workspace-host
      user: workspace
current-context: workspace-local
