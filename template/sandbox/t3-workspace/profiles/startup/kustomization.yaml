apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example-startup-t3
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: t3-workspace
      spec:
        template:
          spec:
            containers:
              - name: t3-workspace
                env:
                  - name: T3_WORKSPACE_PROFILE
                    value: startup
