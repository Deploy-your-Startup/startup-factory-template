apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3-workspace
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3-workspace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-workspace
    spec:
      serviceAccountName: t3-workspace
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: t3-workspace
          image: factory-t3-pilot:0.1.13-factory.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: web
              containerPort: 3773
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 896Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: t3-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t3-workspace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: t3-workspace
  ports:
    - name: web
      port: 3773
      targetPort: web
